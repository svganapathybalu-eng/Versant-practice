<body>
<div class="topbar">

<script>
// --------------------------------------------------------------------------
// 1. DATA REPOSITORY (EXACT COMPLETE 70-ITEM CORPUS FROM REFERENCE)
// --------------------------------------------------------------------------
const T = {
  A: ['Repeat', 'Speaking', 'You will hear a sentence once. Repeat it exactly as you heard it. Speak immediately after the tone.', 15],
  B: ['Sentence Builds', 'Speaking', 'You will hear three short phrases in random order. Say them as one correct sentence after the tone.', 15],
  C: ['Conversations', 'Listening', 'You will hear a short conversation and then a question. Answer with a word or short phrase.', 10],
  D: ['Sentence Completion', 'Reading', 'Type ONE word that best fits the gap. Spelling and capitalization count.', 25],
  E: ['Dictation', 'Listening + Writing', 'You will hear a sentence once. Type it exactly, with correct spelling, capitals, and punctuation.', 25],
  F: ['Passage Reconstruction', 'Reading + Writing', 'Read the passage for 30 seconds. When it vanishes, rewrite it in your own words.', 90]
};

const D = {
  A: [
    "Please switch off your computer before leaving.",
    "Could you pass me that folder on the shelf?",
    "The delivery is expected sometime this afternoon.",
    "I'm not sure whether the client has replied yet.",
    "She joined the company shortly after graduating.",
    "Our office relocated to a bigger building last spring.",
    "He usually takes the early train to avoid traffic.",
    "The presentation covered three main areas of concern.",
    "Everyone was asked to keep their badges visible.",
    "The client requested a revised quotation by evening.",
    "Although he disagreed, he supported the final decision.",
    "The warehouse staff were trained on the new inventory system.",
    "She mentioned that the budget had already been approved.",
    "We were told the shipment would clear customs by Friday.",
    "Despite several setbacks, the team met its quarterly target.",
    "The policy applies to anyone who joined after January."
  ],
  B: [
    [["at the counter", "the manager", "was standing"], ["The manager was standing at the counter"]],
    [["before the storm hit", "we finished", "the outdoor work"], ["We finished the outdoor work before the storm hit", "Before the storm hit we finished the outdoor work"]],
    [["that he submitted", "the application", "was incomplete"], ["The application that he submitted was incomplete"]],
    [["a new laptop", "every intern", "receives"], ["Every intern receives a new laptop"]],
    [["who joined recently", "the trainee", "asked several questions"], ["The trainee who joined recently asked several questions"]],
    [["to avoid delays", "we should", "confirm the booking early"], ["We should confirm the booking early to avoid delays", "To avoid delays we should confirm the booking early"]],
    [["were cancelled", "due to low turnout", "the evening classes"], ["The evening classes were cancelled due to low turnout"]],
    [["that had been damaged", "the courier replaced", "the package"], ["The courier replaced the package that had been damaged"]]
  ],
  C: [
    [["Did you get a chance to review my draft?", "Not yet, I've been stuck in back-to-back calls.", "No worries, tomorrow morning works too.", "Great, I'll send it again as a reminder."], "What will the woman do?", ["send", "remind", "resend"]],
    [["The vending machine on our floor is out of order.", "Again? IT said they fixed it last week.", "Maybe try the one on the third floor.", "Good idea, I'll head there now."], "Where will the man go?", ["third floor", "3rd floor"]],
    [["I heard the client pushed the launch date.", "Yes, to the fifteenth instead of the tenth.", "That gives us a bit more breathing room.", "True, but we still need final approval by Monday."], "What is needed by Monday?", ["approval", "final approval"]],
    [["Can we squeeze in a call before lunch?", "I have back-to-back meetings until one.", "What about right after lunch then?", "That works, let's say one-thirty."], "When will they have the call?", ["1:30", "one thirty", "1.30"]],
    [["The new intern seems really promising.", "Agreed, she picked up the tool in two days.", "Should we consider her for the full-time role?", "Let's discuss it with HR next week."], "Who will they talk to?", ["hr"]],
    [["Our booth at the fair didn't get much footfall.", "I think we were placed too far from the entrance.", "Should we request a better spot next year?", "Definitely, I'll note it for the organisers."], "What will the man do?", ["note", "tell organisers", "request"]],
    [["The invoice you sent has the wrong amount.", "Sorry about that, let me correct it right away.", "Please also update the due date.", "Sure, I'll resend it within the hour."], "When will the corrected invoice be sent?", ["within the hour", "hour", "1 hour"]],
    [["I think we should switch vendors for printing.", "The current one has been reliable though.", "True, but their rates went up recently.", "Let's compare quotes before deciding."], "What will they do before deciding?", ["compare", "get quotes", "compare quotes"]],
    [["Are you attending the leadership workshop?", "I wasn't planning to, it clashes with my shift.", "You could ask your supervisor to swap it.", "That's a good idea, I'll ask her today."], "Who will the woman ask?", ["supervisor", "manager"]],
    [["The report has a few formatting issues.", "I'll clean it up before the noon review.", "Also double check the chart on page two.", "Noted, I'll fix that too."], "What will the man check?", ["chart", "page two", "page 2"]],
    [["We're short-staffed for the evening shift.", "Can we ask someone from the morning team?", "Priya said she could stay back if needed.", "Perfect, let's confirm with her."], "Who might stay back?", ["priya"]],
    [["The client wants the colours changed again.", "This is the third revision this week.", "I know, but let's keep them happy for now.", "Fine, I'll make the changes by tonight."], "When will the changes be made?", ["tonight"]]
  ],
  D: [
    ["We finally managed to ___ a compromise after hours of talks.", ["reach", "find"]],
    ["Please make sure to ___ off all the equipment before leaving.", ["switch", "turn"]],
    ["He tends to ___ credit for work done by his team.", ["take"]],
    ["The client asked us to ___ down the proposal in writing.", ["put"]],
    ["It's hard to ___ up with her pace of work.", ["keep"]],
    ["The two teams finally decided to ___ forces on the project.", ["join"]],
    ["She always ___ great pride in her attention to detail.", ["takes"]],
    ["We need to ___ out a clearer plan before Monday.", ["work", "draw"]],
    ["His excuse didn't really ___ water with the manager.", ["hold"]],
    ["The negotiations eventually broke ___ without an agreement.", ["down"]],
    ["Her presentation left a strong ___ on the panel.", ["impression"]],
    ["The company is under growing ___ to reduce costs.", ["pressure"]],
    ["He was quick to ___ the blame onto his colleague.", ["shift", "pass"]],
    ["It took weeks for the rumour to ___ ground.", ["gain"]],
    ["The evidence clearly points ___ a scheduling error.", ["to", "towards"]],
    ["Despite the setback, team morale remained remarkably ___.", ["high", "strong", "resilient"]],
    ["The proposal failed to ___ the concerns raised earlier.", ["address"]],
    ["He has a habit of ___ over minor details that matter later.", ["glossing"]]
  ],
  E: [
    "Please confirm your seat before Thursday evening.",
    "The office will remain closed on national holidays.",
    "Could you send me the invoice by tomorrow morning?",
    "My manager, Sarah, is out of office this week.",
    "We didn't expect the results to arrive so soon.",
    "Although he was busy, he replied to every email.",
    "You'll need a valid ID, a form, and one photograph.",
    "The workshop, which begins at ten, runs for two hours.",
    "If the courier is delayed, please contact the front desk.",
    "I'll update the spreadsheet as soon as I get the numbers.",
    "The supervisor asked everyone to double-check their entries.",
    "Would you prefer a morning slot or an afternoon one?",
    "Everyone on the floor was informed about the fire drill.",
    "In spite of the rain, the delivery arrived on time."
  ],
  F: [
    ["Farah noticed that the office recycling bins were rarely used. She spoke to her manager about placing clearer labels on each bin. Within two weeks, more employees started sorting their waste correctly, and the office reduced its general waste by nearly a third.", [["farah"], ["recycling"], ["bin"], ["manager"], ["label"], ["two weeks", "2 weeks"], ["sort"], ["waste"], ["third", "30", "one third"]]],
    ["A small clinic in a rural town began offering free health check-ups on the first Sunday of every month. The idea started when the local doctor noticed that many residents avoided visits due to cost. Word spread quickly, and within six months, over three hundred people had attended at least one check-up.", [["clinic"], ["rural", "town"], ["free"], ["check-up", "checkup", "check up"], ["sunday"], ["doctor"], ["cost"], ["word spread", "spread"], ["six months", "6 months"], ["three hundred", "300"]]]
  ]
};

// 70 sequential test items [p, i]
const seq = [];
for (const p of 'ABCDEF') {
  D[p].forEach((_, i) => seq.push([p, i]));
}

// --------------------------------------------------------------------------
// 2. STATE & AUDIO PIPELINE (CONTINUOUS STREAM ARCHITECTURE)
// --------------------------------------------------------------------------
let n = 0, ans = [], mt = [], meta = {}, seen = {}, tm = null, sid = 0;
let rec = null, micStream = null, micReady = false;
let audioCtx = null, analyser = null, animFrame = null;
let speechGateOpen = false; // Prevents audio capture during instructions
let forceTypeFallback = false;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fix = s => String(s).replace(/[’‘]/g, "'").replace(/[“”]/g, '"').trim();
const norm = s => fix(s).toLowerCase().replace(/[^a-z0-9' ]/g, ' ').split(/\s+/).filter(Boolean);
const tok = s => fix(s).match(/[A-Za-z0-9']+|[^\sA-Za-z0-9']/g) || [];

function lcs(a, b) {
  const d = Array(a.length + 1).fill(0).map(() => Array(b.length + 1).fill(0));
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] + 1 : Math.max(d[i - 1][j], d[i][j - 1]);
    }
  }
  return d[a.length][b.length];
}
const rat = (a, b) => lcs(a, b) / Math.max(a.length, b.length, 1);
const cl = x => Math.max(0, Math.min(1, x));
const bag = (t, r) => {
  const c = [...r];
  let k = 0;
  t.forEach(w => {
    const i = c.indexOf(w);
    if (i > -1) { c.splice(i, 1); k++; }
  });
  return k / (t.length || 1);
};

// --------------------------------------------------------------------------
// 3. VOICE ENGINE WITH MULTI-ACCENT DETECTION & 880Hz BEEP
// --------------------------------------------------------------------------
let V = [], ACCENTS = [];
const ACCENT_GROUPS = [
  ['en-US', 'United States'],
  ['en-GB', 'United Kingdom'],
  ['en-IN', 'India'],
  ['en-AU', 'Australia'],
  ['en-CA', 'Canada'],
  ['en-IE', 'Ireland']
];

function loadV() {
  try {
    V = window.speechSynthesis ? speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)) : [];
  } catch (e) {}
  ACCENTS = [];
  ACCENT_GROUPS.forEach(([code, label]) => {
    const v = V.find(x => x.lang.toLowerCase() === code.toLowerCase()) ||
              V.find(x => x.lang.toLowerCase().startsWith(code.slice(0, 2).toLowerCase()) && x.lang.toLowerCase().includes(code.slice(3).toLowerCase()));
    if (v) ACCENTS.push({ code, label, voice: v });
  });
  if (!ACCENTS.length && V.length) ACCENTS.push({ code: V[0].lang, label: V[0].lang, voice: V[0] });
}
loadV();
if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadV;
}

function accentFor(i) {
  if (!ACCENTS.length) return null;
  return ACCENTS[i % ACCENTS.length];
}

function say(t, pitch, rate, vo) {
  return new Promise(r => {
    const to = setTimeout(r, 20000);
    try {
      if (!window.speechSynthesis) { clearTimeout(to); return r(); }
      const u = new SpeechSynthesisUtterance(t);
      u.lang = (vo && vo.lang) || 'en-US';
      u.pitch = pitch || 1;
      u.rate = rate || 0.95;
      if (vo) u.voice = vo;
      u.onend = () => { clearTimeout(to); r(); };
      u.onerror = () => { clearTimeout(to); r(); };
      speechSynthesis.speak(u);
    } catch (e) {
      clearTimeout(to);
      r();
    }
  });
}

function playBeepTone() {
  return new Promise(resolve => {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Official 880Hz cue tone
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
      setTimeout(resolve, 400);
    } catch (e) {
      resolve();
    }
  });
}

const wait = ms => new Promise(r => setTimeout(r, ms));

async function audio(p, i) {
  await wait(250);
  if (p === 'A' || p === 'E') {
    const a = accentFor(i);
    await say(D[p][i], 1, p === 'E' ? 0.9 : 0.95, a && a.voice);
  } else if (p === 'B') {
    const a = accentFor(i);
    for (const t of D.B[i][0]) {
      await say(t, 1, 0.95, a && a.voice);
      await wait(550);
    }
  } else if (p === 'C') {
    const [l, q] = D.C[i];
    let va, vb;
    if (ACCENTS.length >= 2) {
      va = ACCENTS[i % ACCENTS.length].voice;
      vb = ACCENTS[(i + 1) % ACCENTS.length].voice;
    } else {
      let mv = V.find(v => /\bmale\b|david|mark|daniel|james|alex|ravi|rishi|george/i.test(v.name));
      let fv = V.find(v => /female|zira|samantha|susan|karen|veena|heera|hazel|google us english/i.test(v.name));
      va = mv; vb = fv;
    }
    for (let k = 0; k < l.length; k++) {
      const isFirst = k % 2 === 0;
      const vo = isFirst ? va : vb;
      const pch = (!va && !vb) ? (isFirst ? 0.85 : 1.25) : 1;
      await say(l[k], pch, 0.95, vo);
      await wait(350);
    }
    await say('Question. ' + q, 1, 0.95, va);
  }
}

// --------------------------------------------------------------------------
// 4. MICROPHONE & SPEECH RECOGNITION (SINGLE PERMISSION LOCK)
// --------------------------------------------------------------------------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function setupVisualizer(stream) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    src.connect(analyser);

    const buf = new Uint8Array(analyser.frequencyBinCount);
    function loop() {
      if (analyser) {
        analyser.getByteFrequencyData(buf);
        let s = 0;
        for (let i = 0; i < buf.length; i++) s += buf[i];
        let pct = Math.min(100, Math.round((s / buf.length / 128) * 100));
        const bars = document.querySelectorAll('.vol-bar');
        bars.forEach(b => { b.style.width = pct + '%'; });
      }
      animFrame = requestAnimationFrame(loop);
    }
    if (!animFrame) loop();
  } catch (e) {
    console.warn('Visualizer unavailable:', e);
  }
}

function initRec() {
  if (rec || !SR) return;
  try {
    rec = new SR();
    rec.lang = 'en-US';
    rec.continuous = true; // Crucial: Keeps recognition engine alive
    rec.interimResults = true;

    rec.onspeechstart = () => { if (speechGateOpen) meta.ts = Date.now(); };
    rec.onspeechend = () => { if (speechGateOpen) meta.te = Date.now(); };

    rec.onresult = e => {
      if (!speechGateOpen) return;
      let interim = '', finalTranscript = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) {
          finalTranscript += e.results[i][0].transcript + ' ';
          meta.conf = e.results[i][0].confidence;
        } else {
          interim += e.results[i][0].transcript;
        }
      }
      const combined = (finalTranscript + interim).trim();
      meta.txt = combined;
      if ($('ans')) $('ans').value = combined;
      if ($('note')) $('note').textContent = '';
    };

    rec.onerror = e => {
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        if ($('note')) $('note').textContent = 'Mic issue (' + e.error + '). You can type your answer.';
      }
    };

    rec.onend = () => {
      // Reconnect seamlessly if still taking speaking questions
      if (micReady && n < seq.length && !forceTypeFallback) {
        try { rec.start(); } catch (err) {}
      }
    };

    try { rec.start(); } catch (e) {}
  } catch (err) {
    console.warn('SpeechRecognition initialization error:', err);
  }
}

async function chkM() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micReady = true;
    setupVisualizer(micStream);
    initRec();
    $('chk').textContent = SR
      ? 'Microphone verified and locked. Audio permission will persist throughout the test.'
      : 'Microphone connected. Speech recognition not natively supported in this browser; you may type responses.';
    $('chk').style.color = 'var(--ok)';
  } catch (e) {
    $('chk').textContent = 'Microphone permission blocked or unavailable. You can proceed using keyboard input.';
    $('chk').style.color = 'var(--red)';
  }
}

function chkA() {
  speechSynthesis.cancel();
  playBeepTone().then(() => {
    say('The audio test is complete. If you heard the tone and this sentence, your speakers are working.');
    $('chk').textContent = 'Audio test played.';
    $('chk').style.color = 'var(--blue)';
  });
}

async function chkAccents() {
  speechSynthesis.cancel();
  if (!ACCENTS.length) {
    $('chk').textContent = 'No distinct regional English voices found. Standard default synthesizer will be used.';
    return;
  }
  $('chk').textContent = 'Detected voices: ' + ACCENTS.map(a => a.label).join(', ') + '. Playing short samples...';
  for (const a of ACCENTS) {
    await say('This is the ' + a.label + ' accent.', 1, 0.95, a.voice);
    await wait(200);
  }
  $('chk').textContent = 'Accent preview finished: ' + ACCENTS.map(a => a.label).join(', ') + '.';
}

// --------------------------------------------------------------------------
// 5. TEST FLOW & QUESTION LIFECYCLE
// --------------------------------------------------------------------------
function intro() {
  $('app').innerHTML = `
    <div class="panel">
      <div class="part-hd">
        <b>Test Overview & System Calibration</b>
        <span>70 items · 6 parts</span>
      </div>
      <table style="margin-bottom:14px">
        <tr><th>Part</th><th>Task</th><th>Items</th><th>Official Timer</th></tr>
        <tr><td>A</td><td>Repeat</td><td>16</td><td>15s speaking</td></tr>
        <tr><td>B</td><td>Sentence Builds</td><td>8</td><td>15s speaking</td></tr>
        <tr><td>C</td><td>Conversations</td><td>12</td><td>10s response</td></tr>
        <tr><td>D</td><td>Sentence Completion</td><td>18</td><td>25s timer</td></tr>
        <tr><td>E</td><td>Dictation</td><td>14</td><td>25s timer</td></tr>
        <tr><td>F</td><td>Passage Reconstruction</td><td>2</td><td>30s read / 90s rewrite</td></tr>
      </table>
      <div class="instr">
        <strong>Hardware Advice:</strong> Please wear a headset in a quiet room. Click <strong>Test Microphone</strong> and select <strong>Allow</strong> once. The simulator keeps that input channel open in the background so you will not be prompted between questions.
      </div>
      
      <p class="mut" style="font-weight:700;color:var(--ink);margin-bottom:6px">System Check</p>
      <div class="btnrow" style="justify-content:flex-start;border:none;padding-top:0">
        <button onclick="chkA()">Test Audio</button>
        <button onclick="chkM()">Test Microphone</button>
        <button onclick="chkAccents()">Preview Accents</button>
      </div>
      <div class="vol-wrap"><div class="vol-bar"></div></div>
      <p id="chk" class="mut" style="margin-top:6px;min-height:18px"></p>

      <div style="margin:14px 0 6px">
        <label class="mut" style="font-size:.8rem;font-weight:700">Trainee / Candidate ID:</label>
        <input id="tinInput" value="PRACTICE-0001" style="font-family:'Courier New',monospace;padding:6px 10px;margin-top:4px">
      </div>

      <div class="btnrow">
        <button class="pri" onclick="start()">Begin Test</button>
      </div>
    </div>
  `;
}

async function start() {
  const customTin = $('tinInput') ? $('tinInput').value.trim() : 'PRACTICE-0001';$('tinTag').textContent = 'TIN: ' + (customTin || 'PRACTICE-0001');

  // Resume AudioContext on initial click to satisfy browser policy
  if (!audioCtx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioCtx();
  }
  if (audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }

  // Attempt automatic microphone acquisition if not yet clicked
  if (!micReady && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      micReady = true;
      setupVisualizer(micStream);
      initRec();
    } catch (e) {
      console.warn('Microphone permission not granted, defaulting to keyboard fallback.');
    }
  }

  n = 0; ans = []; mt = []; seen = {};
  show();
}

function ring(sec) {
  return `<div class="center"><span class="timerbox" id="tmn">${String(sec).padStart(2, '0')}</span><div class="mut" style="margin-top:4px">seconds remaining</div></div>`;
}

function bar() {
  const pct = Math.round((100 * n) / seq.length);
  return `
    <div class="statusbar">
      <span>Item ${Math.min(n + 1, seq.length)} of ${seq.length}</span>
      <span>${pct}% complete</span>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  `;
}

function cd(tot, f) {
  let t = tot;
  const el = () => $('tmn');
  tm = setInterval(() => {
    t--;
    if (el()) el().textContent = String(Math.max(t, 0)).padStart(2, '0');
    if (t <= 0) {
      clearInterval(tm);
      f();
    }
  }, 1000);
}

function show() {
  clearInterval(tm);
  speechSynthesis.cancel();
  speechGateOpen = false;

  if (n >= seq.length) return finish();

  const my = ++sid;
  const [p, i] = seq[n];
  const t = T[p];
  const accentObj = accentFor(i);
  const accentBadge = (accentObj && (p === 'A' || p === 'B' || p === 'E'))
    ? `<span class="accent-tag">${accentObj.label} Accent</span>`
    : '';

  // Interstitial transition screen at start of each part
  if (i === 0 && !seen[p]) {
    seen[p] = 1;
    $('app').innerHTML = bar() + `
      <div class="panel">
        <div class="part-hd">
          <b>Part ${p}: ${t[0]}</b>
          <span>${t[1]}</span>
        </div>
        <div class="instr">${t[2]}</div>
        <div class="btnrow"><button class="pri" onclick="show()">Continue</button></div>
      </div>
    `;
    return;
  }

  let h = bar() + `
    <div class="panel">
      <div class="part-hd">
        <b>Part ${p}: ${t[0]}</b>
        <div>${accentBadge} <span>${t[1]}</span></div>
      </div>
  `;

  if (p === 'D') {
    h += `
      <p class="qtext">${esc(D.D[i][0])}</p>
      ${ring(25)}
      <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type one word">
      <div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>
    `;
  } else if (p === 'F') {
    h += `
      <div id="fb">
        <p class="qtext">${esc(D.F[i][0])}</p>
        <p class="mut">This passage will be removed automatically after 30 seconds.</p>
        ${ring(30)}
        <div class="btnrow"><button class="pri" onclick="fw()">I Have Finished Reading</button></div>
      </div>
    `;
  } else {
    h += `
      <div class="rec live" id="recind">
        <span class="dot"></span>
        <span id="st">Playing audio…</span>
      </div>
      <div class="vol-wrap" style="margin-bottom:12px"><div class="vol-bar"></div></div>
      ${ring(t[3] || 1)}
    `;

    if (p === 'E') {
      h += `
        <textarea id="ans" autocomplete="off" spellcheck="false" placeholder="Type the sentence exactly as you heard it"></textarea>
      `;
    } else {
      h += `
        <div class="fallback-box" style="display:flex;justify-content:space-between;align-items:center">
          <span>Speak clearly into your microphone after the tone.</span>
          <label style="font-size:.75rem;cursor:pointer"><input type="checkbox" id="fbCheck" onchange="toggleManualInput(this.checked)" ${forceTypeFallback ? 'checked' : ''}> Type answer fallback</label>
        </div>
        <input id="ans" autocomplete="off" placeholder="Your spoken transcript will appear here..." ${forceTypeFallback ? '' : 'readonly'}>
        <p id="note" class="mut" style="min-height:16px"></p>
      `;
    }

    h += `<div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>`;
  }

  $('app').innerHTML = h + '</div>';

  if (p === 'D') {
    cd(25, nx);
    $('ans').focus();
  } else if (p === 'F') {
    cd(30, fw);
  } else {
    (async () => {
      await audio(p, i);
      if (sid !== my) return;

      // Authentic 880Hz tone before speaking sections
      if (p === 'A' || p === 'B') {
        await playBeepTone();
      }

      $('st').textContent = p === 'E' ? 'Type now' : 'Respond now';
      meta.t0 = Date.now();
      speechGateOpen = true;

      cd(T[p][3], nx);

      if (p === 'E') {
        $('ans').focus();
      } else {
        if (!forceTypeFallback && rec) {
          try { rec.start(); } catch (e) {}
        }
      }
    })();
  }
}

function toggleManualInput(checked) {
  forceTypeFallback = checked;
  if ($('ans')) {
    if (checked) {
      $('ans').removeAttribute('readonly');
      $('ans').placeholder = 'Type your answer here...';$('ans').focus();
    } else {
      $('ans').setAttribute('readonly', 'true');$('ans').placeholder = 'Your spoken transcript will appear here...';
    }
  }
}

function fw() {
  clearInterval(tm);
  sid++;
  $('fb').innerHTML = `
    <p class="mut">Rewrite the passage in your own words below. You have 90 seconds.</p>
    ${ring(90)}
    <textarea id="ans" spellcheck="false" placeholder="Type your reconstructed passage here..."></textarea>
    <div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>
  `;
  cd(90, nx);
  $('ans').focus();
}

function nx() {
  clearInterval(tm);
  sid++;
  speechSynthesis.cancel();
  speechGateOpen = false;

  ans.push($('ans') ?$('ans').value : '');
  mt.push(meta);
  meta = {};
  n++;
  show();
}

// --------------------------------------------------------------------------
// 6. SCORING & CEFR / GSE BENCHMARKING ALGORITHMS
// --------------------------------------------------------------------------
function mech(v) {
  const s = v.trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  if (!s.length) return 0;
  return s.filter(x => /^[A-Z]/.test(x) && /[.!?]$/.test(x)).length / s.length;
}

function flu(p, m, nwords) {
  if (m.ts == null || m.te == null || !m.t0) return null;
  const lat = (m.ts - m.t0) / 1000;
  const lim = p === 'A' ? 4 : 6;
  const ls = lat <= lim ? 1 : cl(1 - (lat - lim) / lim);
  const d = (m.te - m.ts) / 1000;
  if (d <= 0.3) return ls;
  const w = nwords / d;
  const rate = w >= 1.8 && w <= 3 ? 1 : w < 1.8 ? cl(w / 1.8) : cl(1 - (w - 3) / 1.5);
  return 0.5 * ls + 0.5 * rate;
}

function sc(p, i, v, m) {
  const x = D[p][i];
  m = m || {};

  if (p === 'A' || p === 'B') {
    const Ts = p === 'A' ? [norm(x)] : x[1].map(norm);
    const w = norm(v);
    const k = Ts.map(a => rat(a, w));
    const b = k.indexOf(Math.max(...k));
    const ok = m.txt != null && m.txt.toLowerCase() === v.trim().toLowerCase();
    return {
      sm: k[b],
      vo: bag(Ts[b], w),
      fl: ok ? flu(p, m, w.length) : null,
      pr: ok && m.conf ? cl((m.conf - 0.62) / 0.28) : null
    };
  }

  if (p === 'C') {
    const w = norm(v);
    const lo = v.toLowerCase();
    return {
      c: x[2].some(k => w.includes(k) || (k.length > 3 && lo.includes(k))) ? 1 : 0
    };
  }

  if (p === 'D') {
    return { d: x[1].includes(fix(v).toLowerCase()) ? 1 : 0 };
  }

  if (p === 'E') {
    const a = tok(x);
    const b = tok(v);
    const pa = a.filter(t => /^[^A-Za-z0-9']/.test(t));
    const pb = b.filter(t => /^[^A-Za-z0-9']/.test(t));
    return {
      lis: bag(norm(x), norm(v)),
      sp: rat(norm(x), norm(v)),
      cap: bag(a.filter(t => /^[A-Z]/.test(t)), b),
      pu: lcs(pa, pb) / Math.max(pa.length, pb.length, 1)
    };
  }

  // Part F: Passage Reconstruction
  const lo = v.toLowerCase();
  const w = norm(v);
  const cov = x[1].filter(g => g.some(k => lo.includes(k))).length / x[1].length;
  const ln = cl((w.length - 0.5 * norm(x[0]).length) / (0.35 * norm(x[0]).length));
  const ss = v.trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  const lk = ss.filter(z => /\b(because|but|and|so|although|while|which|who|when|after|before|then|however)\b/i.test(z)).length / (ss.length || 1);

  return {
    cov,
    con: cov * ln,
    mech: mech(v),
    va: 0.5 * cl(new Set(w).size / (w.length || 1) / 0.85) * ln + 0.5 * cl(lk / 0.5)
  };
}

const K = {
  Speaking: [
    ['Sentence mastery', 'A, B', 'AB', 'sm', 0.3],
    ['Vocabulary', 'A, B', 'AB', 'vo', 0.2],
    ['Fluency', 'A, B (mic)', 'AB', 'fl', 0.25],
    ['Pronunciation', 'A, B (mic)', 'AB', 'pr', 0.25]
  ],
  Listening: [
    ['Understanding conversations', 'C', 'C', 'c', 0.5],
    ['Understanding spoken sentences', 'E', 'E', 'lis', 0.5]
  ],
  Reading: [
    ['Vocabulary and grammar in context', 'D', 'D', 'd', 0.6],
    ['Passage comprehension', 'F', 'F', 'cov', 0.4]
  ],
  Writing: [
    ['Spelling', 'E', 'E', 'sp', 0.2],
    ['Capitalization', 'E', 'E', 'cap', 0.15],
    ['Punctuation', 'E', 'E', 'pu', 0.15],
    ['Content and sequence', 'F', 'F', 'con', 0.2],
    ['Capitals and full stops', 'F', 'F', 'mech', 0.1],
    ['Vocabulary and sentence variety', 'F', 'F', 'va', 0.2]
  ]
};

const band = o => o < 30 ? 'A1' : o < 42 ? 'A2' : o < 54 ? 'B1' : o < 66 ? 'B2' : 'C1';
const toGSE = versantScore => Math.round(10 + ((versantScore - 20) / 60) * 80);

function gauge(label, val) {
  const pct = val == null ? null : Math.round(val * 100);
  return `<tr><td>${label}</td><td>${pct == null ? 'Not assessed (mic needed)' : pct + '%'}</td></tr>`;
}

// --------------------------------------------------------------------------
// 7. COMPREHENSIVE SCORECARD RENDERING
// --------------------------------------------------------------------------
function finish() {
  const it = { A: [], B: [], C: [], D: [], E: [], F: [] };
  let rv = '';

  seq.forEach(([p, i], k) => {
    const v = ans[k] || '';
    const o = sc(p, i, v, mt[k]);
    it[p].push(o);
    const c = p === 'A' || p === 'E' ? D[p][i]
      : p === 'B' ? D.B[i][1][0]
      : p === 'C' ? D.C[i][1] + ' &rarr; ' + D.C[i][2][0]
      : p === 'D' ? D.D[i][0] + ' &rarr; ' + D.D[i][1][0]
      : D.F[i][0];

    rv += `
      <tr>
        <td><strong>${p}${i + 1}</strong></td>
        <td>${esc(v || '(no response)')}</td>
        <td>${esc(c)}</td>
        <td>${Object.values(o).filter(z => z != null).map(z => Math.round(z * 100) + '%').join(' / ')}</td>
      </tr>
    `;
  });

  const av = (ps, key) => {
    const z = ps.flatMap(p => it[p].map(o => o[key])).filter(z => z != null);
    return z.length ? z.reduce((a, b) => a + b, 0) / z.length : null;
  };

  let cards = '', tot = 0, skillPct = {};
  for (const s in K) {
    const rows = K[s].map(r => ({ l: r[0], f: r[1], w: r[4], v: av(r[2].split(''), r[3]) }));
    const ok = rows.filter(r => r.v != null);
    const pct = ok.length ? ok.reduce((a, r) => a + r.v * r.w, 0) / ok.reduce((a, r) => a + r.w, 0) : 0;
    const curved = Math.pow(pct, 1.3);
    const sco = Math.round(20 + 60 * curved);
    tot += sco;
    skillPct[s] = pct;

    cards += `
      <div class="panel">
        <div class="part-hd">
          <b>${s}</b>
          <span class="badge">Versant: ${sco} / 80 &nbsp;·&nbsp; GSE: ${toGSE(sco)}/90 &nbsp;·&nbsp; ${band(sco)}</span>
        </div>
        <table>
          <tr><th>Sub-skill</th><th>Performance</th></tr>
          ${rows.map(r => gauge(r.l, r.v)).join('')}
        </table>
        <details style="margin-top:10px">
          <summary class="mut" style="color:var(--mut);font-weight:400">Where each sub-skill is measured</summary>
          <div style="overflow-x:auto;margin-top:8px">
            <table>
              <tr><th>Sub-skill</th><th>Source Parts</th><th>Weight</th></tr>
              ${rows.map(r => `<tr><td>${r.l}</td><td>${r.f}</td><td>${Math.round(r.w * 100)}%</td></tr>`).join('')}
            </table>
          </div>
        </details>
      </div>
    `;
  }

  const overallVersant = Math.round(tot / 4);
  const overallGSE = toGSE(overallVersant);

  let lsrw = '';
  for (const s2 in K) {
    const p = skillPct[s2];
    const sco = Math.round(20 + 60 * Math.pow(p, 1.3));
    lsrw += `
      <div class="skill-card">
        <div class="sk-name">${s2}</div>
        <div class="sk-num">${sco}<span style="font-size:.9rem;color:var(--mut)"> / 80</span></div>
        <div class="sk-bar"><i style="width:${Math.round(100 * (sco - 20) / 60)}%"></i></div>
        <div class="mut" style="margin-top:4px">GSE: ${toGSE(sco)} · ${band(sco)}</div>
      </div>
    `;
  }

  $('app').innerHTML = `
    <div class="score-hd">
      <div class="lbl">Versant Overall Score</div>
      <div class="num">${overallVersant}</div>
      <div class="lbl">out of 80 &nbsp;·&nbsp; ${band(overallVersant)}</div>
      <div class="score-sub">GSE Equivalent: ${overallGSE} / 90</div>
    </div>
    
    <div class="lsrw">${lsrw}</div>

    <div class="panel">
      <details open>
        <summary>Skill Domain Breakdown</summary>
        <div style="margin-top:12px">${cards}</div>
      </details>
    </div>

    ${partSummaryHtml(it)}

    <div class="panel">
      <p class="mut">
        <strong>Scoring Methodology:</strong> Score = 20 + 60 &times; (weighted sub-skill percentage)<sup>1.3</sup>. This curve mirrors official psychometric weighting, rewarding consistency across syntax, vocabulary, auditory memory, and orthography. Fluency and Pronunciation are derived from microphone latency and confidence scores; typed responses are excluded from acoustic averages without penalizing mastery.
      </p>
    </div>

    <div class="panel">
      <details>
        <summary>Review Every Item (${seq.length} total)</summary>
        <div style="overflow-x:auto;margin-top:10px">
          <table>
            <tr><th>Item</th><th>Your Response</th><th>Target / Expected Answer</th><th>Sub-scores</th></tr>
            ${rv}
          </table>
        </div>
      </details>
    </div>

    <div class="btnrow" style="margin:16px">
      <button onclick="window.print()">Print Score Report (PDF)</button>
      <button class="pri" onclick="intro()">Take Test Again</button>
    </div>
  `;
}

function partSummaryHtml(it) {
  const PN = { A: 'Repeat', B: 'Sentence Builds', C: 'Conversations', D: 'Sentence Completion', E: 'Dictation', F: 'Passage Reconstruction' };
  const BIN = { C: 'c', D: 'd' };
  const rows = Object.keys(PN).map(p => {
    if (BIN[p]) {
      const key = BIN[p];
      const vals = it[p].map(o => o[key]).filter(v => v != null);
      const correct = vals.filter(v => v >= 0.999).length;
      return `<tr><td>Part ${p} — ${PN[p]}</td><td>${it[p].length} items</td><td>${correct} / ${vals.length} correct</td></tr>`;
    }
    const keys = p === 'A' || p === 'B' ? ['sm'] : p === 'E' ? ['lis', 'sp', 'cap', 'pu'] : ['cov'];
    const vals = it[p].flatMap(o => keys.map(k => o[k])).filter(v => v != null);
    const avg = vals.length ? Math.round(100 * vals.reduce((a, b) => a + b, 0) / vals.length) : null;
    return `<tr><td>Part ${p} — ${PN[p]}</td><td>${it[p].length} items</td><td>${avg == null ? 'Not assessed' : avg + '% average accuracy'}</td></tr>`;
  });

  return `
    <div class="panel">
      <div class="part-hd"><b>Part-by-Part Summary</b><span>at a glance</span></div>
      <table>
        <tr><th>Part</th><th>Items</th><th>Result</th></tr>
        ${rows.join('')}
      </table>
    </div>
  `;
}

// Initial boot
intro();
</script>
