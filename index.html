<!DOCTYPE html>

<style>

.qtext{font-size:1.15rem;font-weight:600;margin:12px 0;color:var(--ink)}

<script>
// -------------------------------------------------------------
// 1. DATA REPOSITORY (WITH MULTI-ACCEPTED ANSWERS FOR PART D)
// -------------------------------------------------------------
const T = {
  A: ['Repeat', 'Speaking', 'You will hear a sentence once. Repeat it exactly as you heard it.', 15],
  B: ['Sentence Builds', 'Speaking', 'You will hear three short phrases in random order. Say them as one correct sentence.', 15],
  C: ['Conversations', 'Listening', 'You will hear a short conversation and then a question. Answer with a word or short phrase.', 10],
  D: ['Sentence Completion', 'Reading', 'Type ONE word that best fits the gap. Spelling and capitalization count.', 25],
  E: ['Dictation', 'Listening + Writing', 'You will hear a sentence once. Type it exactly, with correct spelling, capitals and punctuation.', 25],
  F: ['Passage Reconstruction', 'Reading + Writing', 'Read the passage. It disappears after 30 seconds. Rewrite it in your own words.', 90]
};

const D = {
  // PART A: 16 Items (Alternating US & UK)
  A: [
    "The client will review our proposal later this afternoon.",
    "Please make sure your security badge is worn at all times.",
    "The morning train was delayed due to heavy fog.",
    "You can find the updated schedule on the shared drive.",
    "The new supervisor introduced several helpful procedures.",
    "Our team completed the product testing ahead of schedule.",
    "He usually answers urgent client inquiries by email.",
    "The annual conference will take place in central London.",
    "All employees are encouraged to share their feedback.",
    "She asked whether the revised budget had been approved.",
    "The IT department will upgrade our systems this weekend.",
    "Although the task was challenging, everyone contributed.",
    "The delivery driver left the packages with the receptionist.",
    "We need to confirm the attendance numbers before Friday.",
    "His presentation focused on improving customer satisfaction.",
    "The company decided to expand its operations overseas."
  ],

  // PART B: 8 Items (3 Chunks Each)
  B: [
    [["in the meeting room", "the project manager", "is waiting"], ["The project manager is waiting in the meeting room"]],
    [["before leaving the office", "the windows", "please close"], ["Please close the windows before leaving the office", "Before leaving the office please close the windows"]],
    [["that she created", "the detailed spreadsheet", "was very clear"], ["The detailed spreadsheet that she created was very clear"]],
    [["a parking permit", "every new employee", "must request"], ["Every new employee must request a parking permit"]],
    [["to resolve the complaint", "the technical support team", "worked late"], ["The technical support team worked late to resolve the complaint", "To resolve the complaint the technical support team worked late"]],
    [["after the lunch break", "the training session", "will resume"], ["The training session will resume after the lunch break", "After the lunch break the training session will resume"]],
    [["because of bad weather", "the regional flights", "were postponed"], ["The regional flights were postponed because of bad weather", "Because of bad weather the regional flights were postponed"]],
    [["that was missing", "the administrative assistant", "found the file"], ["The administrative assistant found the file that was missing"]]
  ],

  // PART C: 12 Conversations & Comprehension Questions
  C: [
    [["Have you printed the agenda for the meeting?", "I'm doing that now, but the printer is running slow.", "No rush, we still have twenty minutes.", "Alright, I'll bring the copies to room four."], "Where will the man bring the copies?", ["room four", "room 4", "room 04"]],
    [["The air conditioning in this room isn't working.", "Did you submit a request to maintenance?", "Yes, they said someone will inspect it by two.", "Hopefully they fix it before the workshop."], "When will maintenance inspect the air conditioning?", ["two", "2", "2:00", "two o'clock", "2 o'clock"]],
    [["Did the shipment from the vendor arrive today?", "Only half of it came on the morning truck.", "What about the remaining boxes?", "They promised delivery by Thursday."], "When will the rest of the boxes arrive?", ["thursday", "on thursday"]],
    [["Can you help me prepare the client presentation?", "I'd love to, but I have a performance review at three.", "How about four-thirty instead?", "That sounds good, let's meet in my office."], "What time will they meet?", ["4:30", "four thirty", "4.30", "four-thirty"]],
    [["Our manager wants an update on the quarterly figures.", "Should I email her the summary or the full report?", "The summary should be enough for today.", "Understood, I'll send it before noon."], "What will the man send to the manager?", ["summary", "the summary", "summary report"]],
    [["The coffee machine in the break room is broken again.", "Someone should report it to office facilities.", "I already spoke with Sarah this morning.", "Great, she usually gets things sorted quickly."], "Who was notified about the coffee machine?", ["sarah"]],
    [["Are you planning to attend the software demonstration?", "I wanted to, but I have to finish this audit.", "They're holding another session tomorrow afternoon.", "In that case, I'll register for the second one."], "When will the woman attend the demonstration?", ["tomorrow", "tomorrow afternoon", "second session"]],
    [["We need to book a flight for the regional director.", "Does he prefer a morning flight or an evening flight?", "He asked specifically for the morning flight.", "Okay, I'll book the eight o'clock departure."], "Which flight will be booked?", ["morning", "morning flight", "eight o'clock", "8:00", "8 am"]],
    [["The new contractor hasn't received his laptop yet.", "Has HR completed his onboarding paperwork?", "They finished it yesterday afternoon.", "I'll follow up with IT right now."], "Which department will the man contact?", ["it", "it department", "tech support"]],
    [["Do you have time to proofread this announcement?", "I can look at it right after I return from lunch.", "Thanks, please pay special attention to the dates.", "Will do, I'll return it by one."], "What should the man pay special attention to?", ["dates", "the dates", "date"]],
    [["The client asked to reschedule our kickoff call.", "Did they explain why they need to change it?", "Their lead architect is travelling until Wednesday.", "Understood, let's suggest Thursday morning."], "When will they suggest holding the call?", ["thursday", "thursday morning"]],
    [["Our team budget needs to be finalized soon.", "When is the absolute deadline for submission?", "Finance needs it by Friday at five.", "I will finalize the numbers tonight."], "Who requires the finalized budget?", ["finance", "finance department", "finance team"]],
  ],

  // PART D: 18 Items (Multi-accepted synonyms supported)
  D: [
    ["Please make sure to turn ___ the computer before exiting the lab.", ["off", "down"]],
    ["The management team decided to ___ the weekly staff meeting to Friday.", ["move", "shift", "reschedule", "postpone", "push"]],
    ["She showed great dedication and took ___ in completing the project flawlessly.", ["pride"]],
    ["Due to sudden track repairs, the morning train was ___ by thirty minutes.", ["delayed", "postponed", "held"]],
    ["He forgot to ___ his badge when he walked into the security zone.", ["show", "wear", "scan", "display", "present", "swipe"]],
    ["The two companies agreed to ___ forces to create a new mobile application.", ["join", "combine", "unite"]],
    ["She was able to ___ up with a creative solution to the inventory problem.", ["come"]],
    ["The committee will meet tomorrow to ___ the final candidate for the position.", ["select", "choose", "pick", "name"]],
    ["Customer satisfaction has remained remarkably ___ despite the recent price changes.", ["high", "strong", "positive", "stable"]],
    ["The technician managed to ___ the software glitch before the broadcast started.", ["fix", "resolve", "repair", "correct"]],
    ["He has a habit of taking ___ for successes achieved through team collaboration.", ["credit"]],
    ["The updated safety rules ___ to all permanent and contract personnel.", ["apply", "extend"]],
    ["We must carefully ___ the costs before signing an agreement with the supplier.", ["review", "calculate", "check", "assess", "evaluate", "estimate"]],
    ["Her detailed presentation made a very favorable ___ on the executive board.", ["impression"]],
    ["The new store manager has promised to ___ customer complaints more promptly.", ["handle", "address", "resolve", "manage"]],
    ["It took several weeks for the newly introduced policy to ___ general acceptance.", ["gain", "win"]],
    ["Please ___ sure that all the meeting room chairs are placed back neatly.", ["make"]],
    ["They worked through the evening to ___ an agreement before the midnight deadline.", ["reach", "finalize", "conclude", "strike"]],
  ],

  // PART E: 14 Dictations
  E: [
    "Please send the revised proposal by Wednesday afternoon.",
    "The reception desk is located near the main entrance.",
    "Our supervisor will review the project status tomorrow.",
    "You must present a photo ID when collecting your ticket.",
    "The company will provide transportation to the seminar venue.",
    "We did not expect the spare parts to arrive so quickly.",
    "All employees should review the updated handbook carefully.",
    "Although the deadline was tight, the report was submitted.",
    "The maintenance crew worked through the night to restore power.",
    "Please keep your mobile phones on silent during the presentation.",
    "Her explanation helped everyone understand the new policy.",
    "The financial audit will begin on the first day of next month.",
    "Would you prefer to receive the invoice by mail or email?",
    "Every team member contributed to the success of the campaign."
  ],

  // PART F: 2 Passage Reconstructions
  F: [
    ["Marcus noticed that clients frequently asked the same questions about product warranties. He spent his afternoon compiling a simple one-page guide containing the answers. He sent the guide to the customer service team and posted it on the support website. Within two weeks, repetitive customer telephone inquiries decreased by nearly forty percent.",
      [["marcus"], ["client", "customer"], ["warranty", "warranties"], ["guide", "page"], ["support", "service", "website"], ["two weeks", "2 weeks"], ["telephone", "call", "inquiries", "inquiry"], ["forty percent", "40%"]]],
    ["A technology company started offering flexible working hours to reduce employee commuting stress. The initiative was proposed after a staff survey revealed that long travel times were lowering team morale. The program was tested for three months across two departments. Productivity increased significantly, and the company made the flexible schedule permanent for all staff.",
      [["technology", "company"], ["flexible", "hours"], ["commuting", "commute", "travel"], ["survey"], ["morale", "stress"], ["three months", "3 months"], ["productivity"], ["permanent", "all staff"]]]
  ]
};

const seq = [];
for (const p of 'ABCDEF') {
  D[p].forEach((_, i) => seq.push([p, i]));
}

// -------------------------------------------------------------
// 2. STATE & AUDIO PIPELINE
// -------------------------------------------------------------
let n = 0, ans = [], mt = [], meta = {}, seen = {}, tm = null, sid = 0;
let rec = null, micStream = null, micReady = false;
let forceManualInput = false;
let isAcceptingSpeech = false;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fix = s => String(s).replace(/[’‘]/g, "'").replace(/[“”]/g, '"').trim();
const norm = s => fix(s).toLowerCase().replace(/[^a-z0-9' ]/g, ' ').split(/\s+/).filter(Boolean);
const tok = s => fix(s).match(/[A-Za-z0-9']+|[^\sA-Za-z0-9']/g) || [];

function lcs(a, b) {
  const d = Array(a.length + 1).fill(0).map(() => Array(b.length + 1).fill(0));
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] + 1 : Math.max(d[i - 1][j], d[i][j - 1]);
    }
  }
  return d[a.length][b.length];
}
const rat = (a, b) => lcs(a, b) / Math.max(a.length, b.length, 1);
const cl = x => Math.max(0, Math.min(1, x));
const bag = (t, r) => {
  const c = [...r];
  let k = 0;
  t.forEach(w => {
    const i = c.indexOf(w);
    if (i > -1) { c.splice(i, 1); k++; }
  });
  return k / (t.length || 1);
};

// -------------------------------------------------------------
// 3. ROBUST BLUETOOTH / HEADSET AUDIO PIPELINE
// -------------------------------------------------------------
let V = [], voiceUS = null, voiceGB = null;

function loadVoices() {
  try {
    V = window.speechSynthesis ? speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)) : [];
    voiceUS = V.find(v => /en-US/i.test(v.lang) && /natural|google|david|mark|zira/i.test(v.name)) || V.find(v => /en-US/i.test(v.lang));
    voiceGB = V.find(v => /en-GB/i.test(v.lang) && /natural|google|george|hazel|susan/i.test(v.name)) || V.find(v => /en-GB/i.test(v.lang));
  } catch (e) {}
}
loadVoices();
if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

// Auto-recover audio engine when Bluetooth headset connects or changes state
if (navigator.mediaDevices && navigator.mediaDevices.ondevicechange !== undefined) {
  navigator.mediaDevices.ondevicechange = async () => {
    try {
      window.speechSynthesis.cancel();
      loadVoices();
    } catch (e) {}
  };
}

// Resilient 880Hz Tone Generator (Re-instantiates AudioContext per cue to prevent Bluetooth suspension lock)
function playCueTone() {
  return new Promise(resolve => {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();

      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, actx.currentTime);
      gain.gain.setValueAtTime(0.18, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + 0.35);

      setTimeout(() => {
        try { actx.close(); } catch(err) {}
        resolve();
      }, 380);
    } catch (e) {
      resolve();
    }
  });
}

function speakUtterance(text, isBritish, pitch = 1, rate = 0.95, expectedSid) {
  return new Promise(resolve => {
    if (!window.speechSynthesis || (expectedSid && expectedSid !== sid)) {
      return resolve();
    }

    // Bluetooth Safety: If synth is stuck paused, force resume
    if (speechSynthesis.paused) {
      speechSynthesis.resume();
    }

    const u = new SpeechSynthesisUtterance(text);
    const chosenVoice = isBritish ? (voiceGB || voiceUS) : (voiceUS || voiceGB);
    if (chosenVoice) {
      u.voice = chosenVoice;
      u.lang = chosenVoice.lang;
    } else {
      u.lang = isBritish ? 'en-GB' : 'en-US';
    }
    u.pitch = pitch;
    u.rate = rate;

    let timer = setTimeout(() => {
      // Failsafe watchdog: if Bluetooth dropped the audio end event, unblock test flow
      resolve();
    }, 15000);

    u.onend = () => {
      clearTimeout(timer);
      resolve();
    };
    u.onerror = () => {
      clearTimeout(timer);
      resolve();
    };

    speechSynthesis.speak(u);
  });
}

const wait = ms => new Promise(r => setTimeout(r, ms));

async function playTaskAudio(p, i, expectedSid) {
  await wait(250);
  if (expectedSid !== sid) return;

  const isBritish = (i % 2 === 1);

  if (p === 'A' || p === 'E') {
    await speakUtterance(D[p][i], isBritish, 1, p === 'E' ? 0.92 : 0.95, expectedSid);
  } else if (p === 'B') {
    for (const chunk of D.B[i][0]) {
      if (expectedSid !== sid) return;
      await speakUtterance(chunk, isBritish, 1, 0.95, expectedSid);
      await wait(500);
    }
  } else if (p === 'C') {
    const [lines, question] = D.C[i];
    for (let k = 0; k < lines.length; k++) {
      if (expectedSid !== sid) return;
      const speakerIsUK = (k % 2 === 1);
      const pitch = speakerIsUK ? 1.15 : 0.9;
      await speakUtterance(lines[k], speakerIsUK, pitch, 0.95, expectedSid);
      await wait(300);
    }
    if (expectedSid !== sid) return;
    await speakUtterance("Question. " + question, false, 1, 0.95, expectedSid);
  }
}

// -------------------------------------------------------------
// 4. MICROPHONE & SPEECH RECOGNITION (PERSISTENT STREAM)
// -------------------------------------------------------------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function initContinuousRec() {
  if (rec || !SR) return;
  try {
    rec = new SR();
    rec.lang = 'en-US';
    rec.continuous = true;
    rec.interimResults = true;

    rec.onspeechstart = () => {
      if (isAcceptingSpeech) meta.ts = Date.now();
    };
    rec.onspeechend = () => {
      if (isAcceptingSpeech) meta.te = Date.now();
    };

    rec.onresult = e => {
      if (!isAcceptingSpeech) return;
      let interim = '', finalStr = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) {
          finalStr += e.results[i][0].transcript + ' ';
          meta.conf = e.results[i][0].confidence;
        } else {
          interim += e.results[i][0].transcript;
        }
      }
      const full = (finalStr + interim).trim();
      meta.txt = full;
      if ($('ans')) $('ans').value = full;
      if ($('note')) $('note').textContent = '';
    };

    rec.onerror = e => {
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        if ($('note')) $('note').textContent = 'Microphone note (' + e.error + '). You may type your response.';
      }
    };

    rec.onend = () => {
      if (micReady && n < seq.length && !forceManualInput) {
        try { rec.start(); } catch (err) {}
      }
    };

    try { rec.start(); } catch (e) {}
  } catch (err) {
    console.warn('SpeechRecognition init error:', err);
  }
}

async function chkM() {
  try {
    // Acquire audio stream with broad constraints to prevent Bluetooth sample-rate lock
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    micReady = true;
    initContinuousRec();
    $('chk').textContent = SR
      ? 'Microphone verified and locked. Audio stream is persistent across all items.'
      : 'Microphone detected. Browser does not support SpeechRecognition; typing fallback available.';
    $('chk').style.color = 'var(--ok)';
  } catch (e) {
    $('chk').textContent = 'Microphone permission blocked or not found. You can proceed using keyboard input.';
    $('chk').style.color = 'var(--red)';
  }
}

function chkA() {
  speechSynthesis.cancel();
  playCueTone().then(() => {
    speakUtterance('Audio check complete. Your speakers or headset are working properly.', false).then(() => {
      $('chk').textContent = 'Audio test played successfully.';
      $('chk').style.color = 'var(--blue)';
    });
  });
}

// -------------------------------------------------------------
// 5. TEST LIFECYCLE & ZERO-OVERLAP NAVIGATION
// -------------------------------------------------------------
function intro() {
  $('app').innerHTML = `
    <div class="panel">
      <div class="part-hd"><b>Test Overview</b><span>70 items · 6 parts</span></div>
      <table style="margin-bottom:14px">
        <tr><th>Part</th><th>Task</th><th>Items</th><th>Timer</th></tr>
        <tr><td>A</td><td>Repeat</td><td>16</td><td>15s speaking</td></tr>
        <tr><td>B</td><td>Sentence Builds</td><td>8</td><td>15s speaking</td></tr>
        <tr><td>C</td><td>Conversations</td><td>12</td><td>10s response</td></tr>
        <tr><td>D</td><td>Sentence Completion</td><td>18</td><td>25s timer</td></tr>
        <tr><td>E</td><td>Dictation</td><td>14</td><td>25s timer</td></tr>
        <tr><td>F</td><td>Passage Reconstruction</td><td>2</td><td>30s read / 90s rewrite</td></tr>
      </table>
      <div class="instr">
        Each item is timed. Audio is played once. You cannot return to a previous item. Please use a headset in a quiet room. Click <strong>Test Microphone</strong> to allow microphone access once for the entire test.
      </div>
      <p class="mut" style="font-weight:700;color:var(--ink)">System Check</p>
      <div class="btnrow" style="justify-content:flex-start;border:none;padding-top:0">
        <button onclick="chkA()">Test Audio</button>
        <button onclick="chkM()">Test Microphone</button>
      </div>
      <p id="chk" class="mut" style="min-height:16px"></p>
      <div class="btnrow"><button class="pri" onclick="start()">Begin Test</button></div>
    </div>
  `;
}

async function start() {
  if (!micReady && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      micReady = true;
      initContinuousRec();
    } catch (e) {}
  }
  n = 0; ans = []; mt = []; seen = {};
  show();
}

function ring(sec) {
  return `<div class="center"><span class="timerbox" id="tmn">${String(sec).padStart(2, '0')}</span><div class="mut" style="margin-top:4px">seconds remaining</div></div>`;
}

function bar() {
  const pct = Math.round((100 * n) / seq.length);
  return `<div class="statusbar"><span>Item ${Math.min(n + 1, seq.length)} of ${seq.length}</span><span>${pct}% complete</span></div><div class="bar"><i style="width:${pct}%"></i></div>`;
}

function cd(tot, f) {
  let t = tot;
  const el = () => $('tmn');
  tm = setInterval(() => {
    t--;
    if (el()) el().textContent = String(Math.max(t, 0)).padStart(2, '0');
    if (t <= 0) {
      clearInterval(tm);
      f();
    }
  }, 1000);
}

function show() {
  clearInterval(tm);
  window.speechSynthesis.cancel();
  isAcceptingSpeech = false;

  if (n >= seq.length) return finish();

  const currentSid = ++sid;
  const [p, i] = seq[n];
  const t = T[p];

  if (i === 0 && !seen[p]) {
    seen[p] = 1;
    $('app').innerHTML = bar() + `
      <div class="panel">
        <div class="part-hd"><b>Part ${p}: ${t[0]}</b><span>${t[1]}</span></div>
        <div class="instr">${t[2]}</div>
        <div class="btnrow"><button class="pri" onclick="show()">Continue</button></div>
      </div>
    `;
    return;
  }

  let h = bar() + `<div class="panel"><div class="part-hd"><b>Part ${p}: ${t[0]}</b><span>${t[1]}</span></div>`;

  if (p === 'D') {
    h += `
      <p class="qtext">${esc(D.D[i][0])}</p>
      ${ring(25)}
      <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type one word">
      <div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>
    `;
  } else if (p === 'F') {
    h += `
      <div id="fb">
        <p class="qtext">${esc(D.F[i][0])}</p>
        <p class="mut">This passage will be removed automatically after 30 seconds.</p>
        ${ring(30)}
        <div class="btnrow"><button class="pri" onclick="fw()">I Have Finished Reading</button></div>
      </div>
    `;
  } else {
    h += `
      <div class="rec live" id="recind">
        <span class="dot"></span>
        <span id="st">Playing audio…</span>
      </div>
      ${ring(t[3] || 1)}
    `;

    if (p === 'E') {
      h += `<textarea id="ans" autocomplete="off" spellcheck="false" placeholder="Type the sentence exactly as you heard it"></textarea>`;
    } else {
      h += `
        <div class="fallback-row">
          <span>Speak clearly into your microphone after the tone.</span>
          <label style="cursor:pointer"><input type="checkbox" id="tbFb" onchange="toggleFallback(this.checked)" ${forceManualInput ? 'checked' : ''}> Type answer</label>
        </div>
        <input id="ans" autocomplete="off" placeholder="Your spoken response will appear here..." ${forceManualInput ? '' : 'readonly'}>
        <p id="note" class="mut" style="min-height:16px"></p>
      `;
    }

    h += `<div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>`;
  }

  $('app').innerHTML = h + '</div>';

  if (p === 'D') {
    cd(25, nx);
    $('ans').focus();
  } else if (p === 'F') {
    cd(30, fw);
  } else {
    (async () => {
      await playTaskAudio(p, i, currentSid);
      if (currentSid !== sid) return;

      if (p === 'A' || p === 'B') {
        await playCueTone();
      }
      if (currentSid !== sid) return;

      $('st').textContent = (p === 'E') ? 'Type now' : 'Respond now';
      meta.t0 = Date.now();
      isAcceptingSpeech = true;

      cd(T[p][3], nx);

      if (p === 'E') {
        $('ans').focus();
      } else {
        if (!forceManualInput && rec) {
          try { rec.start(); } catch (e) {}
        }
      }
    })();
  }
}

function toggleFallback(checked) {
  forceManualInput = checked;
  if ($('ans')) {
    if (checked) {
      $('ans').removeAttribute('readonly');
      $('ans').placeholder = 'Type your answer here...';$('ans').focus();
    } else {
      $('ans').setAttribute('readonly', 'true');$('ans').placeholder = 'Your spoken response will appear here...';
    }
  }
}

function fw() {
  clearInterval(tm);
  window.speechSynthesis.cancel();
  sid++;
  $('fb').innerHTML = `
    <p class="mut">Rewrite the passage in your own words below.</p>
    ${ring(90)}
    <textarea id="ans" spellcheck="false" placeholder="Type your reconstruction here..."></textarea>
    <div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>
  `;
  cd(90, nx);
  $('ans').focus();
}

function nx() {
  clearInterval(tm);
  window.speechSynthesis.cancel();
  isAcceptingSpeech = false;
  sid++;

  ans.push($('ans') ?$('ans').value : '');
  mt.push(meta);
  meta = {};
  n++;
  show();
}

// -------------------------------------------------------------
// 6. SCORING ENGINE (WITH MULTI-ANSWER MATCHING)
// -------------------------------------------------------------
function mech(v) {
  const s = v.trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  if (!s.length) return 0;
  return s.filter(x => /^[A-Z]/.test(x) && /[.!?]$/.test(x)).length / s.length;
}

function flu(p, m, nwords) {
  if (m.ts == null || m.te == null || !m.t0) return null;
  const lat = (m.ts - m.t0) / 1000;
  const lim = p === 'A' ? 4 : 6;
  const ls = lat <= lim ? 1 : cl(1 - (lat - lim) / lim);
  const d = (m.te - m.ts) / 1000;
  if (d <= 0.3) return ls;
  const w = nwords / d;
  const rate = w >= 1.8 && w <= 3 ? 1 : w < 1.8 ? cl(w / 1.8) : cl(1 - (w - 3) / 1.5);
  return 0.5 * ls + 0.5 * rate;
}

function sc(p, i, v, m) {
  const x = D[p][i];
  m = m || {};

  if (p === 'A' || p === 'B') {
    const Ts = p === 'A' ? [norm(x)] : x[1].map(norm);
    const w = norm(v);
    const k = Ts.map(a => rat(a, w));
    const b = k.indexOf(Math.max(...k));
    const ok = m.txt != null && m.txt.toLowerCase() === v.trim().toLowerCase();
    return {
      sm: k[b],
      vo: bag(Ts[b], w),
      fl: ok ? flu(p, m, w.length) : null,
      pr: ok && m.conf ? cl((m.conf - 0.62) / 0.28) : null
    };
  }

  if (p === 'C') {
    const w = norm(v);
    const lo = v.toLowerCase();
    return {
      c: x[2].some(k => w.includes(k) || (k.length > 3 && lo.includes(k))) ? 1 : 0
    };
  }

  // Part D: Check against all valid synonyms
  if (p === 'D') {
    const cleanedInput = fix(v).toLowerCase().replace(/[^a-z0-9]/g, '');
    const isCorrect = x[1].some(accepted => accepted.toLowerCase().replace(/[^a-z0-9]/g, '') === cleanedInput);
    return { d: isCorrect ? 1 : 0 };
  }

  if (p === 'E') {
    const a = tok(x);
    const b = tok(v);
    const pa = a.filter(t => /^[^A-Za-z0-9']/.test(t));
    const pb = b.filter(t => /^[^A-Za-z0-9']/.test(t));
    return {
      lis: bag(norm(x), norm(v)),
      sp: rat(norm(x), norm(v)),
      cap: bag(a.filter(t => /^[A-Z]/.test(t)), b),
      pu: lcs(pa, pb) / Math.max(pa.length, pb.length, 1)
    };
  }

  // Part F: Passage Reconstruction
  const lo = v.toLowerCase();
  const w = norm(v);
  const cov = x[1].filter(g => g.some(k => lo.includes(k))).length / x[1].length;
  const ln = cl((w.length - 0.5 * norm(x[0]).length) / (0.35 * norm(x[0]).length));
  const ss = v.trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  const lk = ss.filter(z => /\b(because|but|and|so|although|while|which|who|when|after|before|then|however)\b/i.test(z)).length / (ss.length || 1);

  return {
    cov,
    con: cov * ln,
    mech: mech(v),
    va: 0.5 * cl(new Set(w).size / (w.length || 1) / 0.85) * ln + 0.5 * cl(lk / 0.5)
  };
}

const K = {
  Speaking: [
    ['Sentence mastery', 'A, B', 'AB', 'sm', 0.3],
    ['Vocabulary', 'A, B', 'AB', 'vo', 0.2],
    ['Fluency', 'A, B (mic)', 'AB', 'fl', 0.25],
    ['Pronunciation', 'A, B (mic)', 'AB', 'pr', 0.25]
  ],
  Listening: [
    ['Understanding conversations', 'C', 'C', 'c', 0.5],
    ['Understanding spoken sentences', 'E', 'E', 'lis', 0.5]
  ],
  Reading: [
    ['Vocabulary and grammar in context', 'D', 'D', 'd', 0.6],
    ['Passage comprehension', 'F', 'F', 'cov', 0.4]
  ],
  Writing: [
    ['Spelling', 'E', 'E', 'sp', 0.2],
    ['Capitalisation', 'E', 'E', 'cap', 0.15],
    ['Punctuation', 'E', 'E', 'pu', 0.15],
    ['Content and sequence', 'F', 'F', 'con', 0.2],
    ['Capitals and full stops', 'F', 'F', 'mech', 0.1],
    ['Vocabulary and sentence variety', 'F', 'F', 'va', 0.2]
  ]
};

const band = o => o < 30 ? 'A1' : o < 42 ? 'A2' : o < 54 ? 'B1' : o < 66 ? 'B2' : 'C1';

function gauge(label, val) {
  const pct = val == null ? null : Math.round(val * 100);
  return `<tr><td>${label}</td><td>${pct == null ? 'Not assessed' : pct + '%'}</td></tr>`;
}

// -------------------------------------------------------------
// 7. RESULTS DASHBOARD
// -------------------------------------------------------------
function finish() {
  const it = { A: [], B: [], C: [], D: [], E: [], F: [] };
  let rv = '';

  seq.forEach(([p, i], k) => {
    const v = ans[k] || '';
    const o = sc(p, i, v, mt[k]);
    it[p].push(o);
    const c = (p === 'A' || p === 'E') ? D[p][i]
      : (p === 'B') ? D.B[i][1][0]
      : (p === 'C') ? D.C[i][1] + ' → ' + D.C[i][2][0]
      : (p === 'D') ? D.D[i][0] + ' → ' + D.D[i][1].join(' / ')
      : D.F[i][0];

    rv += `<tr><td>${p}${i + 1}</td><td>${esc(v || '(blank)')}</td><td>${esc(c)}</td><td>${Object.values(o).filter(z => z != null).map(z => Math.round(z * 100) + '%').join(' / ')}</td></tr>`;
  });

  const av = (ps, key) => {
    const z = ps.flatMap(p => it[p].map(o => o[key])).filter(z => z != null);
    return z.length ? z.reduce((a, b) => a + b, 0) / z.length : null;
  };

  let cards = '', tot = 0, skillPct = {};
  for (const s in K) {
    const rows = K[s].map(r => ({ l: r[0], f: r[1], w: r[4], v: av(r[2].split(''), r[3]) }));
    const ok = rows.filter(r => r.v != null);
    const pct = ok.length ? ok.reduce((a, r) => a + r.v * r.w, 0) / ok.reduce((a, r) => a + r.w, 0) : 0;
    const curved = Math.pow(pct, 1.3);
    const sco = Math.round(20 + 60 * curved);
    tot += sco;
    skillPct[s] = pct;

    cards += `
      <div class="panel">
        <div class="part-hd"><b>${s}</b><span class="badge">${sco} / 80 &nbsp;·&nbsp; ${band(sco)}</span></div>
        <table><tr><th>Sub-skill</th><th>Score</th></tr>${rows.map(r => gauge(r.l, r.v)).join('')}</table>
        <details style="margin-top:10px">
          <summary class="mut" style="color:var(--mut);font-weight:400">Where each sub-skill is measured</summary>
          <div style="overflow-x:auto;margin-top:8px">
            <table><tr><th>Sub-skill</th><th>From part</th><th>Weight</th></tr>
            ${rows.map(r => `<tr><td>${r.l}</td><td>${r.f}</td><td>${Math.round(r.w * 100)}%</td></tr>`).join('')}
            </table>
          </div>
        </details>
      </div>
    `;
  }

  const O = Math.round(tot / 4);
  let lsrw = '';
  for (const s2 in K) {
    const p = skillPct[s2];
    const sco = Math.round(20 + 60 * Math.pow(p, 1.3));
    lsrw += `
      <div class="skill-card">
        <div class="sk-name">${s2}</div>
        <div class="sk-num">${sco}<span style="font-size:.95rem;color:var(--mut)"> / 80</span></div>
        <div class="sk-bar"><i style="width:${Math.round(100 * (sco - 20) / 60)}%"></i></div>
        <div class="mut" style="margin-top:4px">${band(sco)}</div>
      </div>
    `;
  }

  $('app').innerHTML = `
    <div class="score-hd">
      <div class="lbl">Overall Score</div>
      <div class="num">${O}</div>
      <div class="lbl">out of 80 &nbsp;·&nbsp; ${band(O)}</div>
    </div>
    <div class="lsrw">${lsrw}</div>
    <div class="panel"><details open><summary>Skill Breakdown</summary><div style="margin-top:12px">${cards}</div></details></div>
    <div class="panel"><p class="mut">Score = 20 + 60 × (weighted sub-skill percentage)<sup>1.3</sup>, a curve that rewards consistent, accurate performance and marks down uneven or partial answers more than a straight average would. Fluency and Pronunciation require microphone-captured responses; typed Speaking answers are shown as "Not assessed" and excluded from that average. This report is a practice estimate and is not an official Versant score.</p></div>
    ${partSummaryHtml(it)}
    <div class="panel"><details><summary>Review Every Item (${seq.length} total)</summary><div style="overflow-x:auto;margin-top:10px"><table><tr><th>Item</th><th>Your Answer</th><th>Correct / Target</th><th>Sub-scores</th></tr>${rv}</table></div></details></div>
    <div class="btnrow" style="margin:16px"><button onclick="window.print()">Print Score Report</button><button class="pri" onclick="intro()">Take Test Again</button></div>
  `;
}

function partSummaryHtml(it) {
  const PN = { A: 'Repeat', B: 'Sentence Builds', C: 'Conversations', D: 'Sentence Completion', E: 'Dictation', F: 'Passage Reconstruction' };
  const BIN = { C: 'c', D: 'd' };
  const rows = Object.keys(PN).map(p => {
    if (BIN[p]) {
      const key = BIN[p];
      const vals = it[p].map(o => o[key]).filter(v => v != null);
      const correct = vals.filter(v => v >= 0.999).length;
      return `<tr><td>Part ${p} — ${PN[p]}</td><td>${it[p].length} items</td><td>${correct} / ${vals.length} correct</td></tr>`;
    }
    const keys = (p === 'A' || p === 'B') ? ['sm'] : (p === 'E') ? ['lis', 'sp', 'cap', 'pu'] : ['cov'];
    const vals = it[p].flatMap(o => keys.map(k => o[k])).filter(v => v != null);
    const avg = vals.length ? Math.round(100 * vals.reduce((a, b) => a + b, 0) / vals.length) : null;
    return `<tr><td>Part ${p} — ${PN[p]}</td><td>${it[p].length} items</td><td>${avg == null ? 'Not assessed' : avg + '% average match'}</td></tr>`;
  });

  return `
    <div class="panel">
      <div class="part-hd"><b>Part-by-Part Summary</b><span>at a glance</span></div>
      <table><tr><th>Part</th><th>Items</th><th>Result</th></tr>${rows.join('')}</table>
    </div>
  `;
}

// Initial Boot
intro();
</script>
