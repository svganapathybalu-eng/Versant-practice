<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>V4SET Mock Test</title>
<style>
:root{--blue:#0b3d91;--blue2:#1a56c4;--ink:#1c1f26;--mut:#5b6270;--line:#d7dbe3;--bg:#f4f6f9;--panel:#ffffff;--red:#c62828;--ok:#1b7f3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,Helvetica,"Segoe UI",sans-serif}
.topbar{background:var(--blue);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;
  font-weight:700;letter-spacing:.02em;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topbar .tin{font-weight:400;font-size:.8rem;opacity:.85;font-family:'Courier New',monospace}
.statusbar{background:#eef1f6;border-bottom:1px solid var(--line);padding:6px 16px;display:flex;justify-content:space-between;
  align-items:center;font-size:.8rem;color:var(--mut)}
.bar{height:5px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--blue2)}
main{max-width:700px;margin:0 auto;padding:0 0 40px}
.panel{background:var(--panel);border:1px solid var(--line);margin:16px;padding:22px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.part-hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--blue);padding-bottom:8px;margin-bottom:14px}
.part-hd b{color:var(--blue);font-size:1.02rem}
.part-hd span{font-size:.8rem;color:var(--mut)}
.instr{background:#eef3fb;border:1px solid #c9dcf5;padding:10px 12px;font-size:.88rem;color:#20375e;margin-bottom:14px}
.qtext{font-size:1.15rem;font-weight:600;margin:12px 0;color:var(--ink)}
.rec{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mut);margin:10px 0}
.rec .dot{width:10px;height:10px;border-radius:50%;background:#bbb}
.rec.live .dot{background:var(--red);box-shadow:0 0 0 0 rgba(198,40,40,.6);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,40,40,.55)}70%{box-shadow:0 0 0 9px rgba(198,40,40,0)}100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}
.timerbox{display:inline-block;border:1px solid var(--line);background:#fafbfc;padding:6px 14px;font-family:'Courier New',monospace;
  font-size:1.3rem;font-weight:700;color:var(--blue);border-radius:3px;min-width:52px;text-align:center}
input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid #b7bec9;border-radius:3px;
  background:#fff;color:var(--ink);margin:10px 0}
input:focus,textarea:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 2px rgba(26,86,196,.15)}
textarea{min-height:120px;font-family:inherit}
.btnrow{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
button{font:inherit;font-weight:600;padding:9px 22px;border-radius:3px;border:1px solid #b7bec9;background:#fff;color:var(--ink);cursor:pointer}
button:hover{background:#f2f4f7}
button.pri{background:var(--blue2);color:#fff;border-color:var(--blue2)}
button.pri:hover{background:var(--blue)}
button:disabled{opacity:.5;cursor:default}
.mut{color:var(--mut);font-size:.85rem}
.center{text-align:center}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#eef1f6}
.score-hd{background:var(--blue);color:#fff;padding:18px 20px;text-align:center;margin:16px}
.score-hd .num{font-size:2.6rem;font-weight:800;font-family:'Courier New',monospace}
.score-hd .lbl{font-size:.8rem;letter-spacing:.08em;opacity:.85;text-transform:uppercase}
.lsrw{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin:0 16px;border:1px solid var(--line);border-top:none}
.skill-card{background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:14px}
.skill-card:nth-child(2n){border-right:none}
.sk-name{font-weight:700;color:var(--blue);font-size:.85rem;text-transform:uppercase;letter-spacing:.03em}
.sk-num{font-size:1.7rem;font-weight:800;font-family:'Courier New',monospace;margin:4px 0}
.sk-bar{height:6px;background:#e6e9ee;border-radius:3px;overflow:hidden}
.sk-bar i{display:block;height:100%;background:var(--blue2)}
.badge{font-size:.72rem;border:1px solid var(--line);padding:2px 8px;border-radius:3px;color:var(--mut)}
details summary{cursor:pointer;font-weight:700;color:var(--blue)}
</style></head><body>
<div class="topbar"><span>VERSANT&nbsp; 4 SKILLS ESSENTIAL TEST</span><span class="tin">TIN: PRACTICE-0001</span></div>
<main>

[["that he submitted","the application","was incomplete"],["The application that he submitted was incomplete"]],

[["who joined recently","the trainee","asked several questions"],["The trainee who joined recently asked several questions"]],
[["to avoid delays","we should","confirm the booking early"],["We should confirm the booking early to avoid delays","To avoid delays we should confirm the booking early"]],
[["were cancelled","due to low turnout","the evening classes"],["The evening classes were cancelled due to low turnout"]],
[["that had been damaged","the courier replaced","the package"],["The courier replaced the package that had been damaged"]]],

[["The vending machine on our floor is out of order.","Again? IT said they fixed it last week.","Maybe try the one on the third floor.","Good idea, I'll head there now."],"Where will the man go?",["third floor","3rd floor"]],
[["I heard the client pushed the launch date.","Yes, to the fifteenth instead of the tenth.","That gives us a bit more breathing room.","True, but we still need final approval by Monday."],"What is needed by Monday?",["approval","final approval"]],

[["Are you attending the leadership workshop?","I wasn't planning to, it clashes with my shift.","You could ask your supervisor to swap it.","That's a good idea, I'll ask her today."],"Who will the woman ask?",["supervisor","manager"]],

[["The client wants the colours changed again.","This is the third revision this week.","I know, but let's keep them happy for now.","Fine, I'll make the changes by tonight."],"When will the changes be made?",["tonight"]]],

E:["Please confirm your seat before Thursday evening.","The office will remain closed on national holidays.","Could you send me the invoice by tomorrow morning?","My manager, Sarah, is out of office this week.","We didn't expect the results to arrive so soon.","Although he was busy, he replied to every email.","You'll need a valid ID, a form, and one photograph.","The workshop, which begins at ten, runs for two hours.","If the courier is delayed, please contact the front desk.","I'll update the spreadsheet as soon as I get the numbers.","The supervisor asked everyone to double-check their entries.","Would you prefer a morning slot or an afternoon one?","Everyone on the floor was informed about the fire drill.","In spite of the rain, the delivery arrived on time."],
F:[["Farah noticed that the office recycling bins were rarely used. She spoke to her manager about placing clearer labels on each bin. Within two weeks, more employees started sorting their waste correctly, and the office reduced its general waste by nearly a third.",[["farah"],["recycling"],["bin"],["manager"],["label"],["two weeks","2 weeks"],["sort"],["waste"],["third","30","one third"]]],
["A small clinic in a rural town began offering free health check-ups on the first Sunday of every month. The idea started when the local doctor noticed that many residents avoided visits due to cost. Word spread quickly, and within six months, over three hundred people had attended at least one check-up.",[["clinic"],["rural","town"],["free"],["check-up","checkup","check up"],["sunday"],["doctor"],["cost"],["word spread","spread"],["six months","6 months"],["three hundred","300"]]]]};
const seq=[];for(const p of 'ABCDEF')D[p].forEach((_,i)=>seq.push([p,i]));
let n=0,ans=[],mt=[],meta={},seen={},tm=null,sid=0,rec=null,micStream=null,micReady=false;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fix=s=>s.replace(/[’‘]/g,"'").replace(/[“”]/g,'"').trim();
const norm=s=>fix(s).toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
const tok=s=>fix(s).match(/[A-Za-z0-9']+|[^\sA-Za-z0-9']/g)||[];
function lcs(a,b){const d=Array(a.length+1).fill(0).map(()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return d[a.length][b.length]}
const rat=(a,b)=>lcs(a,b)/Math.max(a.length,b.length,1);
const cl=x=>Math.max(0,Math.min(1,x));
const bag=(t,r)=>{const c=[...r];let k=0;t.forEach(w=>{const i=c.indexOf(w);if(i>-1){c.splice(i,1);k++}});return k/(t.length||1)};
let V=[],ACCENTS=[];
const ACCENT_GROUPS=[['en-US','United States'],['en-GB','United Kingdom'],['en-IN','India'],['en-AU','Australia'],['en-ZA','South Africa'],['en-CA','Canada'],['en-IE','Ireland'],['en-NZ','New Zealand']];
function loadV(){try{V=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){}
ACCENTS=[];ACCENT_GROUPS.forEach(([code,label])=>{const v=V.find(x=>x.lang.toLowerCase()===code.toLowerCase())||V.find(x=>x.lang.toLowerCase().startsWith(code.slice(0,2).toLowerCase())&&x.lang.toLowerCase().includes(code.slice(3).toLowerCase()));if(v)ACCENTS.push({code,label,voice:v})});
if(!ACCENTS.length&&V.length)ACCENTS.push({code:V[0].lang,label:V[0].lang,voice:V[0]});}
loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
const pk=re=>V.find(v=>re.test(v.name));
function accentFor(i){if(!ACCENTS.length)return null;return ACCENTS[i%ACCENTS.length]}
function say(t,pitch,rate,vo){return new Promise(r=>{const to=setTimeout(r,20000);try{const u=new SpeechSynthesisUtterance(t);u.lang=(vo&&vo.lang)||'en-US';u.pitch=pitch||1;u.rate=rate||.95;if(vo)u.voice=vo;u.onend=()=>{clearTimeout(to);r()};u.onerror=()=>{clearTimeout(to);r()};speechSynthesis.speak(u)}catch(e){clearTimeout(to);r()}})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function audio(p,i){await wait(300);
if(p==='A'||p==='E'){const a=accentFor(i);await say(D[p][i],1,p==='E'?.9:.95,a&&a.voice)}
if(p==='B'){const a=accentFor(i);for(const t of D.B[i][0]){await say(t,1,.95,a&&a.voice);await wait(600)}}
if(p==='C'){const [l,q]=D.C[i];
let va,vb;
if(ACCENTS.length>=2){va=ACCENTS[i%ACCENTS.length].voice;vb=ACCENTS[(i+1)%ACCENTS.length].voice}
else{let mv=pk(/\bmale\b|david|mark|daniel|james|alex|ravi|rishi|george/i),fv=pk(/female|zira|samantha|susan|karen|veena|heera|hazel|google us english/i);if(mv&&mv===fv){mv=fv=null}va=mv;vb=fv}
for(let k=0;k<l.length;k++){const m=k%2===0,vo=m?va:vb,pch=(!va&&!vb)?(m?.8:1.3):1;await say(l[k],pch,.95,vo);await wait(350)}
await say('Question. '+q,1,.95,va)}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function initRec(){if(rec||!SR)return;rec=new SR();rec.lang='en-US';rec.continuous=false;rec.interimResults=false;
rec.onspeechstart=()=>{meta.ts=Date.now()};
rec.onspeechend=()=>{meta.te=Date.now()};
rec.onresult=e=>{const r=e.results[0][0];meta.conf=r.confidence;meta.txt=r.transcript.trim();if($('ans'))$('ans').value=r.transcript;if($('note'))$('note').textContent=''};
rec.onerror=()=>{if($('note'))$('note').textContent='Mic unavailable. Type your answer.'};
rec.onend=()=>{try{rec.started=false}catch(e){}}}
function mic(){if(!SR){if($('note'))$('note').textContent='Mic not supported here. Type your answer.';return}
initRec();try{rec.abort()}catch(e){}
try{rec.start();if($('note'))$('note').textContent='Listening...'}catch(e){
/* "already started" on some browsers — retry once after a short delay */
setTimeout(()=>{try{rec.start();if($('note'))$('note').textContent='Listening...'}catch(e2){}},150)}}
function intro(){setAcc('A');$('app').innerHTML=`<div class="panel">
<div class="part-hd"><b>Test Overview</b><span>70 items · 6 parts</span></div>
<table style="margin-bottom:14px"><tr><th>Part</th><th>Task</th><th>Items</th></tr>
<tr><td>A</td><td>Repeat</td><td>16</td></tr><tr><td>B</td><td>Sentence Builds</td><td>8</td></tr>
<tr><td>C</td><td>Conversations</td><td>12</td></tr><tr><td>D</td><td>Sentence Completion</td><td>18</td></tr>
<tr><td>E</td><td>Dictation</td><td>14</td></tr><tr><td>F</td><td>Passage Reconstruction</td><td>2</td></tr></table>
<div class="instr">Each item is timed. Audio is played once. You cannot return to a previous item. Your responses are not scored until the test is complete. Please use a headset in a quiet room. Use Chrome or Edge for microphone-based scoring. Click "Test Microphone" below and allow access once — the test keeps that permission open so you won't be asked again for every Speaking item. Click "Preview Accents" to hear which English accents your browser can play — Conversations and Repeat items will cycle through whichever are available (e.g. US, UK, Indian, Australian), depending on the voices installed on this device.</div>
<p class="mut" style="font-weight:700;color:var(--ink)">System Check</p>
<div class="btnrow" style="justify-content:flex-start;border:none;padding-top:0"><button onclick="chkA()">Test Audio</button><button onclick="chkM()">Test Microphone</button><button onclick="chkAccents()">Preview Accents</button></div>
<p id="chk" class="mut"></p>
<div class="btnrow"><button class="pri" onclick="start()">Begin Test</button></div>
</div>`}
function chkA(){speechSynthesis.cancel();say('The audio is working.');$('chk').textContent='Audio check complete. If you heard the sentence, your speakers are working.'}
async function chkAccents(){speechSynthesis.cancel();if(!ACCENTS.length){$('chk').textContent='No distinct English accent voices were found on this device/browser — audio will use the single default voice. Conversations will still alternate pitch between speakers.';return}
$('chk').textContent='Detected accents: '+ACCENTS.map(a=>a.label).join(', ')+'. Playing a short sample in each — listen for the change in accent.';
for(const a of ACCENTS){await say('This is the '+a.label+' accent.',1,.95,a.voice);await wait(250)}
$('chk').textContent='Accent preview finished. Detected: '+ACCENTS.map(a=>a.label).join(', ')+'.'}
async function chkM(){try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});micReady=true;
/* keep the stream open for the rest of the test — this is what stops the browser
   from re-asking for mic permission on every Speaking question when the file is
   opened directly (file://) instead of from a server. */
initRec();
$('chk').textContent=SR?'Microphone check complete. Speech recognition is available.':'Microphone allowed, but this browser has no speech recognition. Type your speaking answers, or use Chrome or Edge.'}catch(e){$('chk').textContent='Microphone blocked or unavailable. Allow it, or type your speaking answers.'}}
function start(){n=0;ans=[];mt=[];seen={};show()}
function ring(sec,tot){return `<div class="center"><span class="timerbox" id="tmn">${String(sec).padStart(2,'0')}</span><div class="mut" style="margin-top:4px">seconds remaining</div></div>`}
function bar(){return `<div class="statusbar"><span>Item ${Math.min(n+1,seq.length)} of ${seq.length}</span><span>${Math.round(100*n/seq.length)}% complete</span></div><div class="bar"><i style="width:${Math.round(100*n/seq.length)}%"></i></div>`}
function cd(tot,f){let t=tot;const el=()=>$('tmn');tm=setInterval(()=>{t--;if(el())el().textContent=String(Math.max(t,0)).padStart(2,'0');if(t<=0){clearInterval(tm);f()}},1000)}
function show(){clearInterval(tm);speechSynthesis.cancel();try{rec&&rec.abort()}catch(e){}
if(n>=seq.length)return finish();const my=++sid,[p,i]=seq[n],t=T[p];setAcc(p);
if(i===0&&!seen[p]){seen[p]=1;$('app').innerHTML=bar()+`<div class="panel"><div class="part-hd"><b>Part ${p}: ${t[0]}</b><span>${t[1]}</span></div><div class="instr">${t[2]}</div><div class="btnrow"><button class="pri" onclick="show()">Continue</button></div></div>`;return}
let h=bar()+`<div class="panel"><div class="part-hd"><b>Part ${p}: ${t[0]}</b><span>${t[1]}</span></div>`;
if(p==='D')h+=`<p class="qtext">${esc(D.D[i][0])}</p>${ring(25,25)}<input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type one word"><div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>`;
else if(p==='F')h+=`<div id="fb"><p class="qtext">${esc(D.F[i][0])}</p><p class="mut">This passage will be removed automatically.</p>${ring(30,30)}<div class="btnrow"><button class="pri" onclick="fw()">I Have Finished Reading</button></div></div>`;
else{h+=`<div class="rec live" id="recind"><span class="dot"></span><span id="st">Playing audio…</span></div>${ring(0,t[3]||1)}`+(p==='E'?`<textarea id="ans" autocomplete="off" spellcheck="false" placeholder="Type the sentence exactly as you heard it"></textarea>`:`<div class="btnrow" style="justify-content:flex-start;border:none;padding-top:6px"><button onclick="mic()">Use Microphone</button></div><input id="ans" autocomplete="off" placeholder="Your response"><p id="note" class="mut"></p>`)+`<div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>`}
$('app').innerHTML=h+'</div>';
if(p==='D'){cd(25,nx);$('ans').focus()}
else if(p==='F')cd(30,fw);
else(async()=>{await audio(p,i);if(sid!==my)return;$('st').textContent=p==='E'?'Type now':'Respond now';cd(T[p][3],nx);if(p==='E')$('ans').focus();else if(SR)mic()})()}
function fw(){clearInterval(tm);sid++;$('fb').innerHTML=`<p class="mut">Rewrite the passage in your own words below.</p>${ring(90,90)}<textarea id="ans" spellcheck="false" placeholder="Type your answer here"></textarea><div class="btnrow"><button class="pri" onclick="nx()">Next</button></div>`;cd(90,nx);$('ans').focus()}
function nx(){clearInterval(tm);sid++;speechSynthesis.cancel();try{rec&&rec.abort()}catch(e){}ans.push($('ans')?$('ans').value:'');mt.push(meta);meta={};n++;show()}
function mech(v){const s=v.trim().split(/(?<=[.!?])\s+/).filter(Boolean);if(!s.length)return 0;return s.filter(x=>/^[A-Z]/.test(x)&&/[.!?]$/.test(x)).length/s.length}
function flu(p,m,nwords){if(m.ts==null||m.te==null||!m.t0)return null;const lat=(m.ts-m.t0)/1000,lim=p==='A'?4:6,ls=lat<=lim?1:cl(1-(lat-lim)/lim),d=(m.te-m.ts)/1000;if(d<=.3)return ls;const w=nwords/d,rate=w>=1.8&&w<=3?1:w<1.8?cl(w/1.8):cl(1-(w-3)/1.5);return .5*ls+.5*rate}
function sc(p,i,v,m){const x=D[p][i];m=m||{};
if(p==='A'||p==='B'){const Ts=p==='A'?[norm(x)]:x[1].map(norm),w=norm(v),k=Ts.map(a=>rat(a,w)),b=k.indexOf(Math.max(...k)),ok=m.txt!=null&&m.txt.toLowerCase()===v.trim().toLowerCase();return{sm:k[b],vo:bag(Ts[b],w),fl:ok?flu(p,m,w.length):null,pr:ok&&m.conf?cl((m.conf-.62)/.28):null}}
if(p==='C'){const w=norm(v),lo=v.toLowerCase();return{c:x[2].some(k=>w.includes(k)||(k.length>3&&lo.includes(k)))?1:0}}
if(p==='D')return{d:x[1].includes(fix(v))?1:0};
if(p==='E'){const a=tok(x),b=tok(v),pa=a.filter(t=>/^[^A-Za-z0-9']/.test(t)),pb=b.filter(t=>/^[^A-Za-z0-9']/.test(t));return{lis:bag(norm(x),norm(v)),sp:rat(norm(x),norm(v)),cap:bag(a.filter(t=>/^[A-Z]/.test(t)),b),pu:lcs(pa,pb)/Math.max(pa.length,pb.length,1)}}
const lo=v.toLowerCase(),w=norm(v),cov=x[1].filter(g=>g.some(k=>lo.includes(k))).length/x[1].length,ln=cl((w.length-.5*norm(x[0]).length)/(.35*norm(x[0]).length)),ss=v.trim().split(/(?<=[.!?])\s+/).filter(Boolean),lk=ss.filter(z=>/\b(because|but|and|so|although|while|which|who|when|after|before|then|however)\b/i.test(z)).length/(ss.length||1);
return{cov,con:cov*ln,mech:mech(v),va:.5*cl(new Set(w).size/(w.length||1)/.85)*ln+.5*cl(lk/.5)}}
const K={
Speaking:[['Sentence mastery','A, B','AB','sm',.3],['Vocabulary','A, B','AB','vo',.2],['Fluency','A, B (mic)','AB','fl',.25],['Pronunciation','A, B (mic)','AB','pr',.25]],
Listening:[['Understanding conversations','C','C','c',.5],['Understanding spoken sentences','E','E','lis',.5]],
Reading:[['Vocabulary and grammar in context','D','D','d',.6],['Passage comprehension','F','F','cov',.4]],
Writing:[['Spelling','E','E','sp',.2],['Capitalisation','E','E','cap',.15],['Punctuation','E','E','pu',.15],['Content and sequence','F','F','con',.2],['Capitals and full stops','F','F','mech',.1],['Vocabulary and sentence variety','F','F','va',.2]]};
const band=o=>o<30?'A1':o<42?'A2':o<54?'B1':o<66?'B2':'C1';
function gauge(label,val){const pct=val==null?null:Math.round(val*100);return `<tr><td>${label}</td><td>${pct==null?'Not assessed':pct+'%'}</td></tr>`}
function finish(){setAcc('F');const it={A:[],B:[],C:[],D:[],E:[],F:[]};let rv='';
seq.forEach(([p,i],k)=>{const v=ans[k]||'',o=sc(p,i,v,mt[k]);it[p].push(o);const c=p==='A'||p==='E'?D[p][i]:p==='B'?D.B[i][1][0]:p==='C'?D.C[i][1]+' → '+D.C[i][2][0]:p==='D'?D.D[i][0]+' → '+D.D[i][1][0]:D.F[i][0];
rv+=`<tr><td>${p}${i+1}</td><td>${esc(v||'(blank)')}</td><td>${esc(c)}</td><td>${Object.values(o).filter(z=>z!=null).map(z=>Math.round(z*100)+'%').join(' / ')}</td></tr>`});
const av=(ps,key)=>{const z=ps.flatMap(p=>it[p].map(o=>o[key])).filter(z=>z!=null);return z.length?z.reduce((a,b)=>a+b,0)/z.length:null};
let cards='',tot=0,skillPct={};
for(const s in K){const rows=K[s].map(r=>({l:r[0],f:r[1],w:r[4],v:av(r[2].split(''),r[3])})),ok=rows.filter(r=>r.v!=null),pct=ok.reduce((a,r)=>a+r.v*r.w,0)/ok.reduce((a,r)=>a+r.w,0),curved=Math.pow(pct,1.3),sco=Math.round(20+60*curved);tot+=sco;skillPct[s]=pct;
cards+=`<div class="panel"><div class="part-hd"><b>${s}</b><span class="badge">${sco} / 80 &nbsp;·&nbsp; ${band(sco)}</span></div><table><tr><th>Sub-skill</th><th>Score</th></tr>${rows.map(r=>gauge(r.l,r.v)).join('')}</table><details style="margin-top:10px"><summary class="mut" style="color:var(--mut);font-weight:400">Where each sub-skill is measured</summary><div style="overflow-x:auto;margin-top:8px"><table><tr><th>Sub-skill</th><th>From part</th><th>Weight</th></tr>${rows.map(r=>`<tr><td>${r.l}</td><td>${r.f}</td><td>${Math.round(r.w*100)}%</td></tr>`).join('')}</table></div></details></div>`}
const O=Math.round(tot/4);
let lsrw='';
for(const s2 in K){const p=skillPct[s2],sco=Math.round(20+60*Math.pow(p,1.3));
lsrw+=`<div class="skill-card"><div class="sk-name">${s2}</div><div class="sk-num">${sco}<span style="font-size:.95rem;color:var(--mut)"> / 80</span></div><div class="sk-bar"><i style="width:${Math.round(100*(sco-20)/60)}%"></i></div><div class="mut" style="margin-top:4px">${band(sco)}</div></div>`}
$('app').innerHTML=`<div class="score-hd"><div class="lbl">Overall Score</div><div class="num">${O}</div><div class="lbl">out of 80 &nbsp;·&nbsp; ${band(O)}</div></div>
<div class="lsrw">${lsrw}</div>
<div class="panel"><details open><summary>Skill Breakdown</summary><div style="margin-top:12px">${cards}</div></details></div>
<div class="panel"><p class="mut">Score = 20 + 60 × (weighted sub-skill percentage)<sup>1.3</sup>, a curve that rewards consistent, accurate performance and marks down uneven or partial answers more than a straight average would. Fluency and Pronunciation require microphone-captured responses; typed Speaking answers are shown as "Not assessed" and excluded from that average. This report is a practice estimate and is not an official Versant score.</p></div>
${partSummaryHtml(it)}
<div class="panel"><details><summary>Review Every Item (${seq.length} total)</summary><div style="overflow-x:auto;margin-top:10px"><table><tr><th>Item</th><th>Your Answer</th><th>Correct / Target</th><th>Sub-scores</th></tr>${rv}</table></div></details></div>
<div class="btnrow" style="margin:16px"><button class="pri" onclick="intro()">Take Test Again</button></div>`}
function partSummaryHtml(it){
const PN={A:'Repeat',B:'Sentence Builds',C:'Conversations',D:'Sentence Completion',E:'Dictation',F:'Passage Reconstruction'};
const BIN={C:'c',D:'d'};
const rows=Object.keys(PN).map(p=>{
if(BIN[p]){const key=BIN[p],vals=it[p].map(o=>o[key]).filter(v=>v!=null),correct=vals.filter(v=>v>=.999).length;
return `<tr><td>Part ${p} — ${PN[p]}</td><td>${it[p].length} items</td><td>${correct} / ${vals.length} correct</td></tr>`}
const keys=p==='A'||p==='B'?['sm']:p==='E'?['lis','sp','cap','pu']:['cov'];
const vals=it[p].flatMap(o=>keys.map(k=>o[k])).filter(v=>v!=null);
const avg=vals.length?Math.round(100*vals.reduce((a,b)=>a+b,0)/vals.length):null;
return `<tr><td>Part ${p} — ${PN[p]}</td><td>${it[p].length} items</td><td>${avg==null?'Not assessed':avg+'% average match'}</td></tr>`});
return `<div class="panel"><div class="part-hd"><b>Part-by-Part Summary</b><span>at a glance</span></div><table><tr><th>Part</th><th>Items</th><th>Result</th></tr>${rows.join('')}</table></div>`}
intro();
</script>
</body></html>
